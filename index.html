length + (o.noun ? ' ' + o.noun : '')) : ('No ' + (o.noun || 'rows') + ' match'),\n        size: String(size), setSize: (e) => set({ n: Number(e.target.value), p: 0 }),\n        sizes: (o.sizes || [5, 10, 25, 50]).map((n) => ({ v: String(n) })),\n        prev: () => set({ p: Math.max(0, pg - 1) }), next: () => set({ p: Math.min(pages - 1, pg + 1) }),\n        noPrev: pg === 0, noNext: pg >= pages - 1, empty: r.length === 0,\n        pages: Array.from({ length: pages }, (_, i) => ({ n: i + 1, bg: i === pg ? '#eef7ec' : '#ffffff', border: i === pg ? '#2f8f22' : '#dddddd', color: i === pg ? '#1f5f14' : '#111111', go: () => set({ p: i }) }))\n      };\n    };\n    const row = (name, site, shipped, returned, transfer, cont, pal, ages, full, maint) => {\n      const at = cont + pal;\n      const sum = ages.reduce((s, n) => s + n, 0) || 1;\n      const p = (n) => (Math.round(n / sum * 1000) / 10) + '%';\n      return { name, site, shippedN: shipped, returnedN: returned, atN: at, old: ages[2] + ages[3], fullN: full, maintN: parseInt(maint, 10), transferN: Number(String(transfer).replace('−', '-')) || 0,\n        shipped: shipped.toLocaleString('en-US'), returned: returned.toLocaleString('en-US'), transfer,\n        atSite: at.toLocaleString('en-US'), mix: cont + ' cont · ' + pal + ' pal',\n        a1: p(ages[0]), a2: p(ages[1]), a3: p(ages[2]), a4: p(ages[3]), ageText: ages.join(' / '), full, maint };\n    };\n    const ALL = [\n              row('Prairie Ag Co-op', 'Brandon yard', 612, 478, '−12', 104, 18, [46, 41, 23, 12], 9, '14 / 3'),\n        row('Prairie Ag Co-op', 'Westman Custom Application · Virden (recipient)', 388, 301, '+12', 79, 20, [52, 26, 21, 0], 4, '8 / 2'),\n        row('Red River Agronomy', 'Fargo terminal', 540, 452, '0', 76, 12, [60, 18, 10, 0], 6, '11 / 4'),\n        row('Red River Agronomy', 'Dakota Spray Services · Grand Forks (recipient)', 296, 248, '−8', 34, 6, [28, 12, 0, 0], 2, '5 / 0'),\n        row('Hillcrest Farms', 'North site', 204, 160, '+8', 44, 8, [20, 16, 10, 6], 7, '6 / 1'),\n        row('Westfield Growers', 'Main farm', 182, 150, '0', 28, 4, [18, 10, 4, 0], 3, '3 / 1'),\n        row('Bow Valley Ag Supply', 'Cochrane', 166, 81, '0', 72, 13, [0, 12, 31, 42], 11, '9 / 2'),\n        row('Prairie Ag Co-op', 'Souris depot', 142, 120, '0', 18, 4, [12, 6, 4, 0], 2, '2 / 0'),\n        row('Red River Agronomy', 'Wahpeton', 118, 104, '+4', 14, 2, [10, 6, 0, 0], 1, '1 / 0'),\n        row('Hillcrest Farms', 'South site', 96, 70, '0', 22, 4, [8, 6, 6, 6], 3, '4 / 1'),\n        row('Westfield Growers', 'East yard', 64, 58, '0', 6, 0, [6, 0, 0, 0], 0, '0 / 0'),\n        row('Bow Valley Ag Supply', 'Olds', 88, 40, '−4', 40, 8, [4, 10, 14, 20], 6, '5 / 1')\n    ];\n    const CH = ['All', 'Overdue', 'Returned Full', 'Recent Transfers'];\n    const chip = __st.chip || 'All', q = (__st.q || '').toLowerCase();\n    const shown = ALL.filter((c) => (chip === 'All' || (chip === 'Overdue' && c.old > 0) || (chip === 'Returned Full' && c.fullN >= 5) || (chip === 'Recent Transfers' && c.transferN !== 0))\n      && (!q || (c.name + ' ' + c.site).toLowerCase().indexOf(q) >= 0));\n    const tC = TBL('c', shown, [\n      { label: 'BILL TO · SEND-TO LOCATION', k: 'name', s: (c) => c.name + c.site }, { label: 'SHIPPED', k: 'shippedN', desc: true }, { label: 'RETURNED', k: 'returnedN', desc: true },\n      { label: 'TRANSFER', k: 'transferN', desc: true }, { label: 'AT SITE', k: 'atN', desc: true }, { label: 'DAYS ON SITE · 0–30 / 31–60 / 61–90 / 90+', k: 'old', desc: true },\n      { label: 'RET. FULL', k: 'fullN', desc: true }, { label: 'MAINT / RETIRED', k: 'maintN', desc: true }, { label: '', align: 'right' }\n    ], { noun: 'customer locations' });\n    return {\n      tC,\n      chips: CH, chip, q: __st.q || '',\n      pickChip: (c) => this.setState({ chip: c, t_c: Object.assign({}, __st.t_c, { p: 0 }) }),\n      setQ: (v) => this.setState({ q: typeof v === 'string' ? v : '', t_c: Object.assign({}, __st.t_c, { p: 0 }) }),\n    };\n  }\n}\n"},{"id":"Transfer","title":"Transfer assets (modal)","tpl":"\n\n<div class=\"wg\" style=\"width: 1100px; height: 1000px; box-sizing: border-box; background: #8a8b93; display: flex; align-items: center; justify-content: center; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, system-ui, sans-serif;\">\n  <div role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"ttl\" style=\"width: 800px; background: #ffffff; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column;\">\n    <div style=\"display: flex; align-items: center; gap: 12px; padding: 20px 24px; border-bottom: 1px solid #eeeeee;\">\n      <div style=\"flex: 1;\">\n        <h2 id=\"ttl\" style=\"margin: 0; font-weight: 700; font-size: 22px;\">Transfer Assets</h2>\n        <div style=\"font-size: 13.5px; color: #666666; margin-top: 2px;\">Moves containers and pallets between customer locations and opens a new Work Order for the receiving location.</div>\n      </div>\n      <a href=\"#Customers\" aria-label=\"Close\" style=\"width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: #666666; text-decoration: none;\">✕</a>\n    </div>\n\n    <div style=\"padding: 20px 24px; display: flex; flex-direction: column; gap: 16px;\">\n      <div style=\"display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px;\">\n        <div style=\"display: flex; flex-direction: column; gap: 6px;\">\n          <label for=\"from\" style=\"font-weight: 600; font-size: 13px; color: #1f5f14;\">FROM</label>\n          <select id=\"from\" style=\"height: 46px; padding: 0 12px; border: 1px solid #dddddd; border-radius: 8px; font: 600 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #111111; background: #ffffff;\">\n            <option>Prairie Ag Co-op · Brandon yard</option>\n          </select>\n        </div>\n        <div style=\" r; gap: 8px;\">Rows per page <select class=\"pgsel\" value=\"{{ tPg.size }}\" onChange=\"{{ tPg.setSize }}\"><sc-for list=\"{{ tPg.sizes }}\" as=\"z\" hint-placeholder-count=\"4\"><option value=\"{{ z.v }}\">{{ z.v }}</option></sc-for></select></label><span style=\"display: flex; gap: 4px;\"><button type=\"button\" class=\"pg\" onClick=\"{{ tPg.prev }}\" disabled=\"{{ tPg.noPrev }}\" aria-label=\"Previous page\">‹</button><sc-for list=\"{{ tPg.pages }}\" as=\"g\" hint-placeholder-count=\"1\"><button type=\"button\" class=\"pg\" onClick=\"{{ g.go }}\" style=\"border-color: {{ g.border }}; background: {{ g.bg }}; color: {{ g.color }};\">{{ g.n }}</button></sc-for><button type=\"button\" class=\"pg\" onClick=\"{{ tPg.next }}\" disabled=\"{{ tPg.noNext }}\" aria-label=\"Next page\">›</button></span></div>\n      </div>\n    </div>\n  </main>\n</div>\n","code":"\nclass Component extends DCLogic {\n  renderVals() {\n    const __st = this.state || {};\n    const TBL = (key, rows, cols, o) => {\n      o = o || {};\n      const s = __st['t_' + key] || {};\n      const sk = s.k !== undefined ? s.k : (o.k || null);\n      const sd = s.d || o.d || 1;\n      const size = s.n || o.n || 10;\n      const col = cols.find((c) => c.k && c.k === sk);\n      const val = (r) => (col.s ? col.s(r) : r[col.k]);\n      const r = rows.slice();\n      if (col) r.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : (x > y ? 1 : 0)) * sd; });\n      const pages = Math.max(1, Math.ceil(r.length / size));\n      const pg = Math.min(s.p || 0, pages - 1);\n      const set = (p) => this.setState({ ['t_' + key]: Object.assign({ k: sk, d: sd, n: size, p: pg }, p) });\n      const from = r.length ? pg * size + 1 : 0, to = Math.min(r.length, (pg + 1) * size);\n      return {\n        rows: r.slice(pg * size, pg * size + size),\n        heads: cols.map((c) => ({\n          label: c.label, align: c.align || 'left', sortable: !!c.k, plain: !c.k,\n          arrow: c.k ? (c.k === sk ? (sd === 1 pack', mix: [['Humic acid 12%', 20], ['Zinc 9% chelate', 50], ['wait', 20, 'Let sit'], ['Boron 10%', 30]] }\n    ];\n    const O = (pid, wo, billTo, sendTo, date, qty, status, tone) => ({ pid, wo, billTo, sendTo, date, qty, status, tone });\n    const orders = [\n      O('MX-1001', 'WO-2026-10491', 'Prairie Ag Co-op', 'Prairie Ag Co-op · Brandon yard', '2026-10-20', '12 × 30 gal', 'New', 't-info'),\n      O('MX-1002', 'WO-2026-10491', 'Prairie Ag Co-op', 'Prairie Ag Co-op · Brandon yard', '2026-10-20', '12 × 30 gal', 'New', 't-info'),\n      O('MX-1001', 'WO-2026-10482', 'Prairie Ag Co-op', 'Westman Custom Application · Virden', '2026-10-19', '12 × 30 gal', 'Fulfillment', 't-info'),\n      O('MX-1002', 'WO-2026-10482', 'Prairie Ag Co-op', 'Westman Custom Application · Virden', '2026-10-19', '16 × 30 gal', 'Fulfillment', 't-info'),\n      O('MX-1003', 'WO-2026-10482', 'Prairie Ag Co-op', 'Westman Custom Application · Virden', '2026-10-19', '8 × 15 gal', 'Fulfillment', 't-info'),\n      O('MX-1004', 'WO-2026-10480', 'Red River Agronomy', 'Red River Agronomy · Fargo terminal', '2026-10-18', '40 × 15 gal', 'Fulfillment', 't-info'),\n      O('MX-1001', 'WO-2026-10477', 'Hillcrest Farms', 'Hillcrest Farms · North site', '2026-10-16', '10 × 30 gal', 'In QA', 't-warn'),\n      O('MX-1002', 'WO-2026-10477', 'Hillcrest Farms', 'Hillcrest Farms · North site', '2026-10-16', '20 × 30 gal', 'In QA', 't-warn'),\n      O('MX-1003', 'WO-2026-10477', 'Hillcrest Farms', 'Hillcrest Farms · North site', '2026-10-16', '6 × 15 gal', 'In QA', 't-warn'),\n      O('MX-1002', 'WO-2026-10470', 'Red River Agronomy', 'Dakota Spray Services · Grand Forks', '2026-10-14', '24 × 30 gal', 'Ready to ship', 't-ok'),\n      O('MX-1003', 'WO-2026-10466', 'Westfield Growers', 'Westfield Growers · Main farm', '2026-10-12', '16 × 15 gal', 'Shipped', 't-cust'),\n      O('MX-1005', 'WO-2026-10492', 'Hillcrest Farms', 'Hillcrest Farms · North site', '2026-10-20', '18 × 30 gal', 'New', 't-info'),\n      O('MX-1 ortKey = st.sortKey || 'name', sortDir = st.sortDir || 1, dateDir = st.dateDir || -1;\n    const open = st.open || { 'MX-1002': true };\n    const custList = Array.from(new Set(orders.map((o) => o.billTo))).sort();\n    const orderFilterOn = !!(cust || from || to);\n\n    let rows = products.map((p) => {\n      const ords = orders.filter((o) => o.pid === p.id\n        && (!cust || o.billTo === cust)\n        && (!from || o.date >= from)\n        && (!to || o.date <= to))\n        .sort((a, b) => (a.date < b.date ? -1 : a.date > b.date ? 1 : 0) * dateDir);\n      const all = orders.filter((o) => o.pid === p.id);\n      const lastIso = ords.reduce((m, o) => (o.date > m ? o.date : m), '');\n      return { p, ords, all, lastIso };\n    }).filter((r) => {\n      const text = (r.p.name + ' ' + r.p.id).toLowerCase();\n      if (q && text.indexOf(q.toLowerCase()) < 0) return false;\n      if (comp && !r.p.mix.some((m) => m[0] === comp)) return false;\n      if (orderFilterOn && r.ords.length === 0) return false;\n      return true;\n    });\n    rows.sort((a, b) => {\n      let x, y;\n      if (sortKey === 'orders') { x = a.ords.length; y = b.ords.length; }\n      else if (sortKey === 'last') { x = a.lastIso; y = b.lastIso; }\n      else { x = a.p.name.toLowerCase(); y = b.p.name.toLowerCase(); }\n      return (x < y ? -1 : x > y ? 1 : 0) * sortDir;\n    });\n\n    const tPg = TBL('pg', rows, [], { noun: (q || comp || cust || from || to) ? 'matching products' : 'products loaded (2,500 in catalog)', n: 5, sizes: [5, 10, 25, 50] });\n    const sortBy = (k) => () => set({ sortKey: k, sortDir: sortKey === k ? -sortDir : (k === 'name' ? 1 : -1) });\n    const arrow = (k) => (sortKey === k ? (sortDir === 1 ? '▲' : '▼') : '↕');\n    const allOpen = rows.length > 0 && rows.every((r) => open[r.p.id]);\n    const shownOrders = rows.reduce((n, r) => n + r.ords.length, 0);\n\n    return {\n      yes: true,\n      q, comp, cust, from, to,\n      setQ: (e) => set({ q: e.target.value }),\n      setComp: (e) => set({ comp: e.target.value }),\n      setCust: (e) => set({ cust: e.target.value }),\n      setFrom: (e) => set({ from: e.target.value, per: '' }),\n      setTo: (e) => set({ to: e.target.value, per: '' }),\n      clear: () => set({ q: '', comp: '', cust: '', from: '', to: '', per: 'All Time' }),\n      perPills: Object.keys(PSTART).map((label) => { const on = (st.per || 'All Time') === label; return { label, pressed: on, bg: on ? '#2f8f22' : '#ffffff', color: on ? '#ffffff' : '#333333', border: on ? '#2f8f22' : '#cccccc', pick: () => set({ per: label, from: PSTART[label], to: '' }) }; }),\n      compOpts: [{ v: '', label: 'All components' }].concat(ING.map((i) => ({ v: i, label: i }))),\n      custOpts: [{ v: '', label: 'All customers' }].concat(custList.map((c) => ({ v: c, label: c }))),\n      totalOrders: new Set(orders.map((o) => o.wo + o.pid)).size,\n      openOrders: orders.filter((o) => ['New', 'Fulfillment', 'In QA', 'Ready to ship'].indexOf(o.status) >= 0).length,\n      summary: (q || comp || cust || from || to) ? (rows.length + ' products match · ' + shownOrders + ' customer order lines') : ('2,500 products · ' + shownOrders + ' order lines shown for this page'),\n      pageText: (q || comp || cust || from || to) ? ('Showing 1–' + rows.length + ' of ' + rows.length + ' matches') : 'Showing 1–6 of 2,500 products · page 1 of 100',\n      toggleAllLabel: allOpen ? 'Collapse All Orders' : 'Expand All Orders',\n      toggleAll: () => { const n = {}; if (!allOpen) rows.forEach((r) => { n[r.p.id] = true; }); set({ open: n }); },\n      sortName: sortBy('name'), sortOrders: sortBy('orders'), sortLast: sortBy('last'),\n      arrowName: arrow('name'), arrowOrders: arrow('orders'), arrowLast: arrow('last'),\n      sortDate: () => set({ dateDir: -dateDir }), arrowDate: dateDir === 1 ? '▲' : '▼',\n      none: rows.length === 0,\n      tPg, rows: tPg.rows.map((r) => {\n        const isOpen = !!open[r.p.id];\n        return {\n          name: r.p.name, code: r.p.id, desc: r.p.desc,\n          bg: isOpen ? '#f7fbf5' : '#ffffff',\n          seq: (() => { let k = 0; return r.p.mix.map((m, i) => {\n            const isWait = m[0] === 'wait';\n            if (!isWait) k += 1;\n            return {\n              isIng: !isWait, isWait, n: k,\n              name: isWait ? (m[2] + ' ' + m[1] + ' min') : m[0], title: isWait ? (m[2] + ' ' + m[1] + ' minutes before the next step') : '',\n              pct: isWait ? '' : m[1] + '%', more: i < r.p.mix.length - 1,\n              bg: comp && m[0] === comp ? '#d9eed3' : '#f4f4f4',\n              border: comp && m[0] === comp ? '#2f8f22' : '#e3e3e3'\n            };\n          }); })(),\n          count: r.ords.length,\n          customers: Array.from(new Set(r.ords.map((o) => o.billTo))).join(', ') || '—',\n          last: r.lastIso ? fmt(r.lastIso) : '—',\n          open: isOpen, noOrders: r.ords.length === 0,\n          toggleLabel: (isOpen ? 'Hide Orders ▴' : 'Orders (' + r.ords.length + ') ▾'),\n          toggle: () => set({ open: Object.assign({}, open, { [r.p.id]: !isOpen }) }),\n          orders: r.ords.map((o) => Object.assign({}, o, { dateText: fmt(o.date), link: o.wo === 'WO-2026-10482', noLink: o.wo !== 'WO-2026-10482' }))\n        };\n      })\n    };\n  }\n}\n"},{"id":"ProductNew","title":"New custom mix product","tpl":"\n\n<div class=\"wg\" style=\"min-height: 100vh; background: #f0f0f0; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, system-ui, sans-serif;\">\n  <header style=\"background: #2f8f22; color: #ffffff; min-height: 60px; display: flex; flex-wrap: wrap; align-items: center; padding: 0 28px; gap: 18px;\">\n    <span style=\"font-weight: 600; font-size: 15px;\">Warehouse Operations</span>\n    <span style=\"flex: 1;\"></span>\n    <a href=\"#SapApi\" data-sapapi=\"1\" aria-label=\"SAP API health: 1 failing, needs attention\" style=\"position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; background: rgba(255,255,255,.15); color: #ffffff; font-weight: 700; font-size: 13px; text-decoration: none;\">SAP API<span aria-hidden=\"true\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #c62828; color: #ffffff; font-weight: 800; font-size: 13px; box-shadow: 0 0 0 2px #ffffff;\">!</span></a>\n    <span style=\"font-weight: 600; font-size: 13px; background: rgba(255,255,255,.15); padding: 8px 16px; border-radius: 6px;\">T. Cole — Warehouse supervisor</span>\n  </header>\n  <nav aria-label=\"Module\" style=\"background: #ffffff; display: flex; gap: 4px; padding: 0 28px; overflow-x: auto; border-bottom: 1px solid #dddddd;\">\n    <a href=\"#Main\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Work Orders</a>\n    <a href=\"#Products\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #1f5f14; text-decoration: none; border-bottom: 3px solid #1f5f14; white-space: nowrap;\">Products</a>\n    <a href=\"#Ingredients\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Ingredients</a>\n    <a href=\"#Reconciliation\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">SAP Reconciliation<span style=\"display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: #c62828; color: #ffffff; font-size: 12px; font-weight: 700;\">5</span></a>\n    <a href=\"#Assets\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Containers &amp; Pallets</a>\n    <a href=\"#Customers\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Customer Assets</a>\n    <a href=\"#ServiceMaintenance\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Service &amp; Maintenance</a>\n    <a href=\"#\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Reports</a>\n  </nav>\n\n  <main style=\"max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 20px 28px 40px; display: flex; flex-direction: column; gap: 16px;\">\n    <div style=\"font-size: 20px; color: #666666;\"><a href=\"#Products\" style=\"font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;\"><span aria-hidden=\"true\" style=\"font-size: 40px; line-height: 1; margin-top: -4px;\">‹</span>Custom Mix Products</a></div>\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 14px;\">\n      <div style=\"flex: 1 1 320px;\">\n        <h1 style=\"margin: 0; font-weight: 700; font-size: 24px;\">New Custom Mix Product</h1>\n        <div style=\"font-size: 14px; color: #666666; margin-top: 4px;\">List the steps in the order they happen at the blender. Operators follow and confirm these on the handheld.</div>\n      </div>\n      <a href=\"#Products\" style=\"display: block; text-decoration: none;\"><x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.SecondaryButton\" hint-size=\"110px,44px\">Cancel</x-import></a>\n      <a href=\"#Products\" style=\"display: block; text-decoration: none; width: 180px;\"><x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.PrimaryButton\" full-width=\"{{ yes }}\" disabled=\"{{ cantSave }}\" hint-size=\"180px,52px\">Save Product</x-import></a>\n    </div>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start;\">\n      <div style=\"flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 16px;\">\n        <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.SectionCard\" label=\"PRODUCT DETAILS\" hint-size=\"100%,200px\">\n          <div style=\"display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;\">\n            <label class=\"lbl\" style=\"grid-column: span 2;\">PRODUCT NAME<input class=\"fld\" type=\"text\" value=\"{{ name }}\" onChange=\"{{ setName }}\"></label>\n            <label class=\"lbl\">PRODUCT CODE<input class=\"fld\" type=\"text\" value=\"MX-2501\" style=\"font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;\"></label>\n            <label class=\"lbl\">BATCH SIZE (GAL)<input class=\"fld\" type=\"number\" min=\"1\" value=\"{{ batch }}\" onChange=\"{{ setBatch }}\"></label>\n            <label class=\"lbl\" style=\"grid-column: span 2;\">DESCRIPTION<input class=\"fld\" type=\"text\" value=\"In-furrow starter with sulfur and zinc\"></label>\n            <label class=\"lbl\">PACKAGED IN\n              <select class=\"fld\"><option>15 or 30 gal containers</option><option>30 gal containers only</option><option>15 gal containers only</option></select>\n            </label>\n            <label class=\"lbl\">BLENDER\n              <select class=\"fld\"><option>Blender 1 · 1,000 gal</option><option>Blender 2 · 500 gal</option></select>\n            </label>\n          </div>\n        </x-import>\n\n        <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.SectionCard\" label=\"MIX SEQUENCE &amp; INSTRUCTIONS\" hint-size=\"100%,520px\">\n          <div style=\"overflow-x: auto;\">\n            <div style=\"min-width: 820px; display: flex; flex-direction: column;\">\n              <div style=\"font-size: 13.5px; color: #666666; margin-bottom: 10px;\">Steps run top to bottom on the handheld. Use <b>Add ingredient</b> for blender additions, <b>Wait</b> for timed holds (agitate, let sit), and <b>Instruction</b> for checks the operator must confirm.</div>\n              <div style=\"display: grid; grid-template-columns: 44px 140px 1.7fr 100px 58px 2.2fr 118px; gap: 10px; padding: 0 0 8px; font-weight: 600; font-size: 12px; color: #666666; letter-spacing: .04em; border-bottom: 1px solid #eeeeee;\">\n                <span>STEP</span><span>TYPE</span><span>INGREDIENT / DURATION</span><span>AMOUNT (GAL)</span><span>% MIX</span><span>OPERATOR INSTRUCTION</span><span style=\"text-align: right;\">MOVE · REMOVE</span>\n              </div>\n              <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n                <div style=\"display: grid; grid-template-columns: 44px 140px 1.7fr 100px 58px 2.2fr 118px; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid #f3f3f3; background: {{ r.rowBg }};\">\n                  <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%; background: {{ r.dot }}; color: #ffffff; font-weight: 700; font-size: 15px;\">{{ r.n }}</span>\n                  <select class=\"fld\" value=\"{{ r.type }}\" onChange=\"{{ r.setType }}\" aria-label=\"Step type\">\n                    <option value=\"ing\">Ingredient</option><option value=\"wait\">Wait</option><option value=\"note\">Instruction</option>\n                  </select>\n                  <span style=\"min-width: 0;\">\n                    <sc-if value=\"{{ r.isIng }}\" hint-placeholder-val=\"{{ true }}\">\n                      <select class=\"fld\" value=\"{{ r.ing }}\" onChange=\"{{ r.setIng }}\" style=\"border-color: {{ r.ingBorder }};\" aria-label=\"Ingredient\">\n                        <sc-for list=\"{{ ingOpts }}\" as=\"o\" hint-placeholder-count=\"8\"><option value=\"{{ o.v }}\">{{ o.label }}</option></sc-for>\n                      </select>\n                    </sc-if>\n                    <sc-if value=\"{{ r.isWait }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"display: flex; align-items: center; gap: 8px;\"><input class=\"fld\" type=\"number\" min=\"1\" value=\"{{ r.mins }}\" onChange=\"{{ r.setMins }}\" aria-label=\"Minutes\" style=\"width: 90px;\"><span style=\"font-weight: 600; font-size: 14px; color: #444444;\">minutes</span></span>\n                    </sc-if>\n                    <sc-if value=\"{{ r.isNote }}\" hint-placeholder-val=\"{{ false }}\">\n                      <span style=\"font-size: 14px; color: #666666;\">Operator confirms</span>\n                    </sc-if>\n                  </span>\n                  <span>\n                    <sc-if value=\"{{ r.isIng }}\" hint-placeholder-val=\"{{ true }}\"><input class=\"fld\" type=\"number\" min=\"0\" value=\"{{ r.amt }}\" onChange=\"{{ r.setAmt }}\" aria-label=\"Amount in gallons\"></sc-if>\n                    <sc-if value=\"{{ r.notIng }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"color: #999999;\">—</span></sc-if>\n                  </span>\n                  <span style=\"font-weight: 600; font-size: 14px; color: #444444;\">{{ r.pct }}</span>\n                  <input class=\"fld\" type=\"text\" value=\"{{ r.note }}\" onChange=\"{{ r.setNote }}\" placeholder=\"{{ r.ph }}\" aria-label=\"Operator instruction\">\n                  <span style=\"display: flex; justify-content: flex-end; gap: 6px;\">\n                    <button type=\"button\" class=\"ib\" onClick=\"{{ r.up }}\" disabled=\"{{ r.first }}\" aria-label=\"Move earlier\">↑</button>\n                    <button type=\"button\" class=\"ib\" onClick=\"{{ r.down }}\" disabled=\"{{ r.last }}\" aria-label=\"Move later\">↓</button>\n                    <button type=\"button\" class=\"ib\" onClick=\"{{ r.remove }}\" aria-label=\"Remove step\" style=\"color: #c62828;\">✕</button>\n                  </span>\n                </div>\n              </sc-for>\n              <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding-top: 12px;\">\n                <button type=\"button\" onClick=\"{{ addIng }}\" style=\"height: 44px; padding: 0 16px; border: 1px dashed #2f8f22; background: #eef7ec; border-radius: 8px; font-family: inherit; font-weight: 600; font-size: 15px; color: #1f6a15; cursor: pointer;\">+ Add Ingredient</button>\n                <button type=\"button\" onClick=\"{{ addWait }}\" style=\"height: 44px; padding: 0 16px; border: 1px dashed #2f8f22; background: #ffffff; border-radius: 8px; font-family: inherit; font-weight: 600; font-size: 15px; color: #1f6a15; cursor: pointer;\">+ Add Wait</button>\n                <button type=\"button\" onClick=\"{{ addNote }}\" style=\"height: 44px; padding: 0 16px; border: 1px dashed #2f8f22; background: #ffffff; border-radius: 8px; font-family: inherit; font-weight: 600; font-size: 15px; color: #1f6a15; cursor: pointer;\">+ Add Instruction</button>\n                <span style=\"flex: 1;\"></span>\n                <span style=\"font-size: 15px;\">Ingredients <b>{{ total }} gal</b> of {{ batch }} gal batch · {{ waitTotal }} min of waits</span>\n                <span style=\"font-weight: 700; font-size: 14px; padding: 6px 10px; border-radius: 6px; color: {{ totalColor }}; background: {{ totalBg }};\">{{ totalMsg }}</span>\n              </div>\n              <sc-if value=\"{{ hasDup }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"margin-top: 10px; font-size: 14px; font-weight: 600; color: #c62828; background: #fdecea; border-radius: 8px; padding: 10px 12px;\">An ingredient is listed twice. Combine the amounts into one step.</div>\n              </sc-if>\n            </div>\n          </div>\n        </x-import>\n      </div>\n\n      <div style=\"flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 16px;\">\n        <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.SectionCard\" label=\"BLENDER SEQUENCE PREVIEW\" hint-size=\"100%,300px\">\n          <div style=\"display: flex; flex-direction: column;\">\n            <div style=\"font-weight: 700; font-size: 17px; margin-bottom: 10px;\">{{ name }}</div>\n            <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"3\">\n              <div style=\"display: grid; grid-template-columns: 28px minmax(0, 1fr); column-gap: 10px;\">\n                <div style=\"display: flex; flex-direction: column; align-items: center;\"><span style=\"flex: none; display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 24px; border-radius: 50%; background: {{ r.dot }}; color: #ffffff; font-weight: 700; font-size: 12px;\">{{ r.n }}</span><sc-if value=\"{{ r.notLast }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"flex: 1; width: 2px; background: #dddddd; margin-top: 4px;\"></span></sc-if></div>\n                <div style=\"padding-bottom: 14px;\"><div style=\"font-weight: 600; font-size: 14.5px;\">{{ r.title }}</div><div style=\"font-size: 13px; color: #666666;\">{{ r.noteText }}</div></div>\n              </div>\n            </sc-for>\n          </div>\n        </x-import>\n\n        <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.SectionCard\" label=\"TRIPLE RINSE RULE FOR THIS PRODUCT\" hint-size=\"100%,260px\">\n          <div style=\"display: flex; flex-direction: column; gap: 10px; font-size: 14px; line-height: 1.45;\">\n            <div>A container can be filled with <b>{{ name }}</b> without a triple rinse only when every ingredient in its last product is also in this product:</div>\n            <div style=\"display: flex; flex-wrap: wrap; gap: 6px;\">\n              <sc-for list=\"{{ ingSet }}\" as=\"i\" hint-placeholder-count=\"3\"><span style=\"font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #eef7ec; color: #1f5f14;\">{{ i.name }}</span></sc-for>\n            </div>\n            <div style=\"font-weight: 600; font-size: 12px; color: #666666; letter-spacing: .04em; margin-top: 4px;\">NO RINSE NEEDED AFTER · {{ okCount }} OF 2,500 PRODUCTS</div>\n            <sc-for list=\"{{ okAfter }}\" as=\"p\" hint-placeholder-count=\"2\">\n              <div style=\"display: flex; gap: 8px;\"><span aria-hidden=\"true\" style=\"color: #2c6e31; font-weight: 700;\">✓</span><span><b>{{ p.name }}</b> <span style=\"color: #666666;\">· {{ p.ings }}</span></span></div>\n            </sc-for>\n            <div style=\"display: flex; gap: 8px; margin-top: 4px;\"><span aria-hidden=\"true\" style=\"color: #c62828; font-weight: 700;\">✕</span><span>All other products (<b>{{ rinseCount }}</b>) need a triple rinse first. For example: {{ rinseEx }}.</span></div>\n            <a href=\"#Products\" style=\"font-weight: 600; font-size: 13px; text-decoration: none;\">View compatible products ›</a>\n          </div>\n        </x-import>\n      </div>\n    </div>\n  </main>\n</div>\n","code":"\nclass Component extends DCLogic {\n  renderVals() {\n    const st = this.state || {};\n    const ING = ['APP 10-34-0', 'ATS 12-0-0-26S', 'KTS 0-0-25-17S', 'UAN 28-0-0', 'Zinc 9% chelate', 'Boron 10%', 'Humic acid 12%'];\n    // Sample of the 2,500-product catalog; the real check runs against every product's ingredient list.\n    const CATALOG = [\n      { name: 'ZincPro Starter', ings: ['APP 10-34-0', 'Humic acid 12%', 'Zinc 9% chelate'] },\n      { name: 'S-Boost Starter', ings: ['APP 10-34-0', 'ATS 12-0-0-26S', 'Zinc 9% chelate'] },\n      { name: 'K-Sul Foliar', ings: ['KTS 0-0-25-17S', 'Humic acid 12%', 'Boron 10%'] },\n      { name: 'Boron Plus Foliar', ings: ['UAN 28-0-0', 'Boron 10%'] },\n      { name: 'Starter 10-34 + S', ings: ['APP 10-34-0', 'ATS 12-0-0-26S'] },\n      { name: 'Micro Mix ZnB', ings: ['Humic acid 12%', 'Zinc 9% chelate', 'Boron 10%'] },\n      { name: 'APP Straight 10-34-0', ings: ['APP 10-34-0'] },\n      { name: 'Thio-Start 10-34 + 12S', ings: ['APP 10-34-0', 'ATS 12-0-0-26S'] }\n    ];\n    const rows = st.rows || [\n      { id: 1, type: 'note', note: 'Confirm blender is clean or last held this product. Close drain valve.' },\n      { id: 2, type: 'ing', ing: 'APP 10-34-0', amt: 65, note: 'Base. Fill blender first.' },\n      { id: 3, type: 'wait', mins: 5, note: 'Start agitation and run 5 min before the next ingredient.' },\n      { id: 4, type: 'ing', ing: 'ATS 12-0-0-26S', amt: 25, note: 'Add slowly with agitation running.' },\n      { id: 5, type: 'wait', mins: 15, note: 'Let mix sit 15 min before adding zinc (avoids precipitate).' },\n      { id: 6, type: 'ing', ing: 'Zinc 9% chelate', amt: 10, note: 'Pre-dilute 1:1 with water, then add.' },\n      { id: 7, type: 'wait', mins: 10, note: 'Agitate 10 min.' },\n      { id: 8, type: 'note', note: 'Pull 1 L QA sample and label it with the WO number.' }\n    ];\n    const name = st.name != null ? st.name : 'Prairie Pulse Starter';\n    const batch = st.batch != null ? st.batch : 100;\n    const nextId = st.nextId || 9;\n    const setRows = (r) => this.setState({ rows: r });\n    const upd = (i, patch) => setRows(rows.map((r, j) => (j === i ? Object.assign({}, r, patch) : r)));\n    const move = (i, d) => { const r = rows.slice(); const t = r[i]; r[i] = r[i + d]; r[i + d] = t; setRows(r); };\n\n    const ingRows = rows.filter((r) => r.type === 'ing');\n    const total = ingRows.reduce((s, r) => s + (Number(r.amt) || 0), 0);\n    const waitTotal = rows.filter((r) => r.type === 'wait').reduce((s, r) => s + (Number(r.mins) || 0), 0);\n    const b = Number(batch) || 0;\n    const counts = {};\n    ingRows.forEach((r) => { counts[r.ing] = (counts[r.ing] || 0) + 1; });\n    const set = Array.from(new Set(ingRows.map((r) => r.ing)));\n    const okAfter = CATALOG.filter((p) => p.ings.every((i) => set.indexOf(i) >= 0));\n    const rinseAfter = CATALOG.filter((p) => !p.ings.every((i) => set.indexOf(i) >= 0));\n    const diff = Math.round((total - b) * 10) / 10;\n    const ok = ingRows.length > 0 && diff === 0;\n    const dup = Object.keys(counts).some((k) => counts[k] > 1);\n    const add = (row) => this.setState({ rows: rows.concat([Object.assign({ id: nextId }, row)]), nextId: nextId + 1 });\n    const okCount = okAfter.length + 1;\n\n    return {\n      yes: true, name, batch,\n      setName: (e) => this.setState({ name: e.target.value }),\n      setBatch: (e) => this.setState({ batch: e.target.value }),\n      ingOpts: ING.map((i) => ({ v: i, label: i })),\n      total: Math.round(total * 10) / 10, waitTotal,\n      totalMsg: ok ? '✓ Balanced' : (diff < 0 ? (-diff) + ' gal short' : diff + ' gal over'),\n      totalColor: ok ? '#2c6e31' : '#7a5200',\n      totalBg: ok ? '#e4f2dc' : '#fff3d6',\n      cantSave: !ok || dup || !name,\n      hasDup: dup,\n      addIng: () => add({ type: 'ing', ing: ING.find((i) => set.indexOf(i) < 0) || ING[0], amt: 0, note: '' }),\n      addWait: () => add({ type: 'wait', mins: 5, note: '' }),\n      addNote: () => add({ type: 'note', note: '' }),\n      ingSet: set.map((n) => ({ name: n })),\n      okCount: okCount.toLocaleString('en-US'),\n      rinseCount: (2500 - okCount).toLocaleString('en-US'),\n      rinseEx: rinseAfter.slice(0, 2).map((p) => p.name + ' (has ' + p.ings.filter((i) => set.indexOf(i) < 0).join(', ') + ')').join('; '),\n      okAfter: [{ name: name || 'This product', ings: 'same product' }].concat(okAfter.map((p) => ({ name: p.name, ings: p.ings.join(', ') }))),\n      rows: rows.map((r, i) => {\n        const isIng = r.type === 'ing', isWait = r.type === 'wait', isNote = r.type === 'note';\n        return {\n          n: i + 1, type: r.type, ing: r.ing || ING[0], amt: r.amt, mins: r.mins, note: r.note || '',\n          isIng, isWait, isNote, notIng: !isIng,\n          dot: isIng ? '#1f5f14' : (isWait ? '#a36000' : '#666666'),\n          rowBg: isIng ? '#ffffff' : (isWait ? '#fffaf0' : '#fafafa'),\n          title: isIng ? ('Add ' + (r.amt || 0) + ' gal ' + r.ing) : (isWait ? ('⏱ Wait ' + (r.mins || 0) + ' min') : 'Operator check'),\n          noteText: r.note || (isNote ? 'No instruction entered' : 'No instruction'),\n          ph: isIng ? 'e.g. Add slowly with agitation' : (isWait ? 'e.g. Let mix sit before next ingredient' : 'e.g. Check blender is clean'),\n          pct: isIng && b ? (Math.round((Number(r.amt) || 0) / b * 1000) / 10) + '%' : '—',\n          ingBorder: isIng && counts[r.ing] > 1 ? '#c62828' : '#cccccc',\n          first: i === 0, last: i === rows.length - 1, notLast: i < rows.length - 1,\n          setType: (e) => { const t = e.target.value; upd(i, t === 'ing' ? { type: t, ing: r.ing || ING[0], amt: r.amt || 0 } : (t === 'wait' ? { type: t, mins: r.mins || 5 } : { type: t })); },\n          setIng: (e) => upd(i, { ing: e.target.value }),\n          setAmt: (e) => upd(i, { amt: e.target.value }),\n          setMins: (e) => upd(i, { mins: e.target.value }),\n          setNote: (e) => upd(i, { note: e.target.value }),\n          up: () => { if (i > 0) move(i, -1); },\n          down: () => { if (i < rows.length - 1) move(i, 1); },\n          remove: () => setRows(rows.filter((_, j) => j !== i))\n        };\n      })\n    };\n  }\n}\n"},{"id":"Ingredients","title":"Ingredient inventory","tpl":"\n\n<div class=\"wg\" style=\"min-height: 100vh; background: #f0f0f0; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, system-ui, sans-serif;\">\n  <header style=\"background: #2f8f22; color: #ffffff; min-height: 60px; display: flex; flex-wrap: wrap; align-items: center; padding: 0 28px; gap: 18px;\">\n    <span style=\"font-weight: 600; font-size: 15px;\">Warehouse Operations</span>\n    <span style=\"flex: 1;\"></span>\n    <a href=\"#SapApi\" data-sapapi=\"1\" aria-label=\"SAP API health: 1 failing, needs attention\" style=\"position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; background: rgba(255,255,255,.15); color: #ffffff; font-weight: 700; font-size: 13px; text-decoration: none;\">SAP API<span aria-hidden=\"true\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #c62828; color: #ffffff; font-weight: 800; font-size: 13px; box-shadow: 0 0 0 2px #ffffff;\">!</span></a>\n    <span style=\"font-weight: 600; font-size: 13px; background: rgba(255,255,255,.15); padding: 8px 16px; border-radius: 6px;\">T. Cole — Warehouse supervisor</span>\n  </header>\n  <nav aria-label=\"Module\" style=\"background: #ffffff; display: flex; gap: 4px; padding: 0 28px; overflow-x: auto; border-bottom: 1px solid #dddddd;\">\n    <a href=\"#Main\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Work Orders</a>\n    <a href=\"#Products\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Products</a>\n    <a href=\"#Ingredients\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #1f5f14; text-decoration: none; border-bottom: 3px solid #1f5f14; white-space: nowrap;\">Ingredients</a>\n    <a href=\"#Reconciliation\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weig stem of record; differences are sent to reconciliation.</div>\n      </div>\n      <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.SecondaryButton\" hint-size=\"160px,44px\"><span aria-hidden=\"true\" style=\"font-size: 24px; line-height: 1; vertical-align: -3px; margin-right: 4px;\">⬇</span>Export CSV</x-import>\n      <div style=\"width: 210px;\"><x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.PrimaryButton\" full-width=\"{{ yes }}\" hint-size=\"210px,52px\">Receive Ingredient</x-import></div>\n    </div>\n\n    <div role=\"group\" aria-label=\"Filter ingredients\" style=\"display: flex; flex-wrap: wrap; gap: 14px;\">\n      <sc-for list=\"{{ tiles }}\" as=\"t\" hint-placeholder-count=\"5\">\n        <button type=\"button\" class=\"tile\" onClick=\"{{ t.pick }}\" aria-pressed=\"{{ t.on }}\" style=\"flex: 1 1 160px; background: {{ t.bg }}; border-color: {{ t.border }}; border-radius: 10px; padding: 14px 18px;\"><div style=\"font-weight: 600; font-size: 12px; color: {{ t.color }};\">{{ t.label }}</div><div style=\"font-weight: 700; font-size: 28px;\">{{ t.count }}</div></button>\n      </sc-for>\n    </div>\n\n    <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.FilterBar\" placeholder=\"Filter ingredients by name, SAP material #, tank, or supplier…\" chips=\"{{ chips }}\" selected-chip=\"{{ chipSel }}\" on-chip-select=\"{{ pickChip }}\" query=\"{{ q }}\" on-query-change=\"{{ setQ }}\" hint-size=\"100%,96px\"></x-import>\n\n    <div style=\"background: #ffffff; border-radius: 10px; overflow-x: auto;\">\n      <div style=\"min-width: 1280px;\">\n        <div style=\"display: grid; grid-template-columns: 1.5fr 1.3fr 1.8fr .8fr 1fr 1.1fr 1.5fr 1.1fr; gap: 12px; padding: 12px 18px; border-bottom: 2px solid #eeeeee; font-weight: 600; font-size: 12px; color: #666666; letter-spacing: .04em;\"><sc-for list=\"{{ tI.heads }}\" as=\"h\" hint-placeholder-count=\"8\"><span style=\"text-align: {{ h.align }};\"><sc-if value=\"{{ h.sortable }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"sorth\" onClick=\"{{ h.sort }}\">{{ h.label }}<span class=\"ar\">{{ h.arrow }}</span></button></sc-if><sc-if value=\"{{ h.plain }}\" hint-placeholder-val=\"{{ false }}\">{{ h.label }}</sc-if></span></sc-for></div>\n        <sc-for list=\"{{ tI.rows }}\" as=\"r\" hint-placeholder-count=\"10\">\n          <div style=\"border-bottom: 1px solid #f3f3f3; background: {{ r.bg }};\">\n            <div style=\"display: grid; grid-template-columns: 1.5fr 1.3fr 1.8fr .8fr 1fr 1.1fr 1.5fr 1.1fr; gap: 12px; align-items: center; padding: 13px 18px; font-size: 14px;\">\n              <span><span style=\"display: block; font-weight: 700; font-size: 15px;\">{{ r.name }}</span><span style=\"display: block; font-size: 12.5px; color: #666666;\">SAP mat. <span class=\"mono\">{{ r.sap }}</span></span></span>\n              <span><span style=\"display: block; color: #444444;\">{{ r.storage }}</span><span style=\"display: block; font-size: 12.5px; color: #666666;\">Supplier: {{ r.supplier }}</span></span>\n              <span style=\"display: flex; flex-direction: column; gap: 6px;\">\n                <span style=\"display: flex; justify-content: space-between; gap: 8px;\"><span style=\"font-weight: 700;\">{{ r.onHand }}</span><span style=\"font-size: 12.5px; color: #666666;\">of {{ r.cap }} · {{ r.levelPct }}</span></span>\n                <span style=\"display: block; height: 8px; background: #f0f0f0; border-radius: 2px; overflow: hidden; position: relative;\"><span style=\"display: block; height: 8px; background: {{ r.barColor }}; width: {{ r.levelPct }};\"></span></span>\n              </span>\n              <span>{{ r.alloc }}</span>\n              <span><span style=\"display: block; font-weight: 700; color: {{ r.availColor }};\">{{ r.avail }}</span><span style=\"display: block; font-size: 12px; color: #666666;\">reorder at {{ r.reorder }}</span></span>\n              <span><span style=\"display: block;\">{{ r.sapQty }}</span><sc-if value=\"{{ r.hasVar }}\" hint-placeholder-val=\"{{ false }}\"><a href=\"#Reconciliation\" style=\"display: inline-block; margin-top: 3px; font-weight: 700; font-size: 12px; padding: 2px 7px; border-radius: 5px; background: {{ r.varBg }}; color: {{ r.varFg }}; text-decoration: none;\">{{ r.varText }} · reconcile ›</a></sc-if><sc-if value=\"{{ r.noVar }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"display: block; font-size: 12px; color: #2c6e31; font-weight: 600;\">✓ Matches SAP</span></sc-if></span>\n              <span><span style=\"display: block; font-weight: 600;\">{{ r.usedCount }} products</span><a href=\"#Products\" style=\"font-size: 12.5px; text-decoration: none;\">e.g. {{ r.usedEx }} ›</a></span>\n              <span style=\"display: flex; flex-direction: column; align-items: flex-end; gap: 6px;\"><span class=\"chip {{ r.tone }}\">{{ r.status }}</span><button type=\"button\" onClick=\"{{ r.toggle }}\" style=\"border: none; background: none; padding: 0; font-family: inherit; font-weight: 600; font-size: 13px; color: #2f8f22; cursor: pointer;\">Adjust Qty</button></span>\n            </div>\n            <sc-if value=\"{{ r.open }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin: 0 18px 14px; padding: 12px 14px; border: 1px solid #cfe5c8; border-radius: 8px; background: #f7fbf5; display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end;\">\n                <label style=\"display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 12px; color: #666666;\">COUNTED / GAUGED QTY (GAL)<input class=\"fld\" type=\"number\" value=\"{{ r.draft }}\" onChange=\"{{ r.setDraft }}\" style=\"width: 150px;\"></label>\n                <label style=\"display: flex; flex-direction: column; gap: 4px; font-weight: 600; font-size: 12px; color: #666666;\">REASON\n                  <select class=\"fld\" style=\"width: 260px;\"><option>Delivery received over/under PO</option><option>Tank gauge / dip reading</option><option>Tote count</option><option>Spill or loss</option><option>Other</option></select>\n                </label>\n                <span style=\"flex: 1 1 200px; font-size: 13px; color: #444444;\">Changes our on-hand from <b>{{ r.onHand }}</b> to <b>{{ r.draftFmt }}</b> gal ({{ r.draftDiff }}). Takes effect now so orders can be fulfilled, and is flagged for SAP reconciliation.</span>\n                <button type=\"button\" onClick=\"{{ r.toggle }}\" style=\"height: 40px; padding: 0 14px; border: 1px solid #cccccc; background: #ffffff; border-radius: 8px; font-family: inherit; font-weight: 600; font-size: 14px; cursor: pointer;\">Cancel</button>\n                <button type=\"button\" onClick=\"{{ r.save }}\" style=\"height: 40px; padding: 0 16px; border: none; background: #2f8f22; color: #ffffff; border-radius: 8px; font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;\">Save Adjustment</button>\n              </div>\n            </sc-if>\n            <sc-if value=\"{{ r.saved }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"margin: 0 18px 14px; padding: 10px 14px; border-radius: 8px; background: #eef7ec; color: #1f5f14; font-size: 13.5px;\">✓ Adjusted by T. Cole just now · {{ r.savedText }} · <a href=\"#Reconciliation\" style=\"font-weight: 600;\">Flagged for SAP reconciliation ›</a></div>\n            </sc-if>\n          </div>\n        </sc-for>\n        <sc-if value=\"{{ tI.empty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding: 22px 18px; text-align: center; font-size: 14px; color: #666666;\">Nothing matches these filters.</div></sc-if><div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 18px; border-top: 1px solid #eeeeee; font-size: 13.5px; color: #666666;\"><span style=\"flex: 1;\">{{ tI.text }}</span><label style=\"display: flex; align-items: center; gap: 8px;\">Rows per page <select class=\"pgsel\" value=\"{{ tI.size }}\" onChange=\"{{ tI.setSize }}\"><sc-for list=\"{{ tI.sizes }}\" as=\"z\" hint-placeholder-count=\"4\"><option value=\"{{ z.v }}\">{{ z.v }}</option></sc-for></select></label><span style=\"display: flex; gap: 4px;\"><button type=\"button\" class=\"pg\" onClick=\"{{ tI.prev }}\" disabled=\"{{ tI.noPrev }}\" aria-label=\"Previous page\">‹</button><sc-for list=\"{{ tI.pages }}\" as=\"g\" hint-placeholder-count=\"1\"><button type=\"button\" class=\"pg\" onClick=\"{{ g.go }}\" style=\"border-color: {{ g.border }}; background: {{ g.bg }}; color: {{ g.color }};\">{{ g.n }}</button></sc-for><button type=\"button\" class=\"pg\" onClick=\"{{ tI.next }}\" disabled=\"{{ tI.noNext }}\" aria-label=\"Next page\">›</button></span></div>\n        <div style=\"padding: 0 18px 12px; font-size: 13px; color: #666666;\">Allocated = gallons needed by open work orders not yet blended. Need Attention = short for open work orders or below reorder point.</div>\n      </div>\n    </div>\n\n    <div style=\"display: flex; flex-wrap: wrap; gap: 16px;\">\n      <div style=\"flex: 1 1 520px; min-width: 0;\">\n        <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.SectionCard\" label=\"ALLOCATED TO OPEN WORK ORDERS\" hint-size=\"100%,300px\">\n          <div style=\"overflow-x: auto;\">\n            <div style=\"min-width: 520px; display: flex; flex-direction: column;\">\n              <div style=\"display: grid; grid-template-columns: 1.2fr 1.6fr 2.6fr; gap: 10px; padding: 8px 0; border-bottom: 1px solid #f3f3f3; font-weight: 600; font-size: 12px; color: #666666; letter-spacing: .04em;\"><sc-for list=\"{{ tAl.heads }}\" as=\"h\" hint-placeholder-count=\"3\"><span style=\"text-align: {{ h.align }};\"><sc-if value=\"{{ h.sortable }}\" hint-placeholder-val=\"{{ true }}\"><button type=\"button\" class=\"sorth\" onClick=\"{{ h.sort }}\">{{ h.label }}<span class=\"ar\">{{ h.arrow }}</span></button></sc-if><sc-if value=\"{{ h.plain }}\" hint-placeholder-val=\"{{ false }}\">{{ h.label }}</sc-if></span></sc-for></div>\n              <sc-for list=\"{{ tAl.rows }}\" as=\"a\" hint-placeholder-count=\"4\">\n                <div style=\"display: grid; grid-template-columns: 1.2fr 1.6fr 2.6fr; gap: 10px; padding: 11px 0; font-size: 14px; border-bottom: 1px solid #f3f3f3;\">\n                  <span class=\"mono\" style=\"font-weight: 600;\">{{ a.wo }}</span>\n                  <span style=\"color: #444444;\">{{ a.products }}</span>\n                  <span style=\"color: #444444;\">{{ a.needs }}</span>\n                </div>\n              </sc-for>\n              <sc-if value=\"{{ tAl.empty }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"padding: 22px 18px; text-align: center; font-size: 14px; color: #666666;\">Nothing matches these filters.</div></sc-if><div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 12px 0 0; font-size: 13.5px; color: #666666;\"><span style=\"flex: 1;\">{{ tAl.text }}</span><label style=\"display: flex; align-items: center; gap: 8px;\">Rows per page <select class=\"pgsel\" value=\"{{ tAl.size }}\" onChange=\"{{ tAl.setSize }}\"><sc-for list=\"{{ tAl.sizes }}\" as=\"z\" hint-placeholder-count=\"4\"><option value=\"{{ z.v }}\">{{ z.v }}</option></sc-for></select></label><span style=\"display: flex; gap: 4px;\"><button type=\"button\" class=\"pg\" onClick=\"{{ tAl.prev }}\" disabled=\"{{ tAl.noPrev }}\" aria-label=\"Previous page\">‹</button><sc-for list=\"{{ tAl.pages }}\" as=\"g\" hint-placeholder-count=\"1\"><button type=\"button\" class=\"pg\" onClick=\"{{ g.go }}\" style=\"border-color: {{ g.border }}; background: {{ g.bg }}; color: {{ g.color }};\">{{ g.n }}</button></sc-for><button type=\"button\" class=\"pg\" onClick=\"{{ tAl.next }}\" disabled=\"{{ tAl.noNext }}\" aria-label=\"Next page\">›</button></span></div>\n            </div>\n          </div>\n        </x-import>\n      </div>\n      <div style=\"flex: 1 1 420px; min-width: 0;\">\n        <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.SectionCard\" label=\"INBOUND DELIVERIES (SAP PURCHASE ORDERS)\" hint-size=\"100%,300px\">\n          <div style=\"display: flex; flex-direction: column;\">\n            <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.ListRow\" icon=\"⛟\" title=\"Humic acid 12% · 550 gal (2 totes)\" caption=\"PO 4500771260 · arriving 21 Oct · Live Earth\" hint-size=\"100%,70px\"></x-import>\n            <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.ListRow\" icon=\"⛟\" title=\"Zinc 9% chelate · 1,100 gal (4 totes)\" caption=\"PO 4500771204 · arriving 22 Oct · Brandt\" hint-size=\"100%,70px\"></x-import>\n            <x-import component-from-global-scope=\"SCTechDesignSystem_9f6dac.ListRow\" icon=\"⛟\" title=\"ATS 12-0-0-26S · 4,000 gal\" caption=\"PO 4500771251 · arriving 23 Oct · to tank T-02 · record metered qty on receipt\" hint-size=\"100%,70px\"></x-import>\n          </div>\n        </x-import>\n      </div>\n    </div>\n  </main>\n</div>\n","code":"\nclass Component extends DCLogic {\n  renderVals() {\n    const __st = this.state || {};\n    const TBL = (key, rows, cols, o) => {\n      o = o || {};\n      const s = __st['t_' + key] || {};\n      const sk = s.k !== undefined ? s.k : (o.k || null);\n      const sd = s.d || o.d || 1;\n      const size = s.n || o.n || 10;\n      const col = cols.find((c) => c.k && c.k === sk);\n      const val = (r) => (col.s ? col.s(r) : r[col.k]);\n      const r = rows.slice();\n      if (col) r.sort((a, b) => { const x = val(a), y = val(b); return (x < y ? -1 : (x > y ? 1 : 0)) * sd; });\n      const pages = Math.max(1, Math.ceil(r.length / size));\n      const pg = Math.min(s.p || 0, pages - 1);\n      const set = (p) => this.setState({ ['t_' + key]: Object.assign({ k: sk, d: sd, n: size, p: pg }, p) });\n      const from = r.length ? pg * size + 1 : 0, to = Math.min(r.length, (pg + 1) * size);\n      return {\n        rows: r.slice(pg * size, pg * size + size),\n        heads: cols.map((c) => ({\n          label: c.label, align: c.align || 'left', sortable: !!c.k, plain: !c.k,\n          arrow: c.k ? (c.k === sk ? (sd === 1 ? '▲' : '▼') : '↕') : '',\n          sort: () => { if (c.k) set({ k: c.k, d: c.k === sk ? -sd : (c.desc ? -1 : 1), p: 0 }); }\n        })),\n        text: r.length ? ('Showing ' + from + '–' + to + ' of ' + r.length + (o.noun ? ' ' + o.noun : '')) : ('No ' + (o.noun || 'rows') + ' match'),\n        size: String(size), setSize: (e) => set({ n: Number(e.target.value), p: 0 }),\n        sizes: (o.sizes || [5, 10, 25, 50]).map((n) => ({ v: String(n) })),\n        prev: () => set({ p: Math.max(0, pg - 1) }), next: () => set({ p: Math.min(pages - 1, pg + 1) }),\n        noPrev: pg === 0, noNext: pg >= pages - 1, empty: r.length === 0,\n        pages: Array.from({ length: pages }, (_, i) => ({ n: i + 1, bg: i === pg ? '#eef7ec' : '#ffffff', border: i === pg ? '#2f8f22' : '#dddddd', color: i === pg ? '#1f5f14' : '#111111', go: () => set({ p: i }) }))\n      };\n    };\n    const st = this.state || {};\n    const n = (x) => Math.round(x).toLocaleString('en-US');\n    const I = (name, sap, supplier, storage, onHand, cap, alloc, reorder, sapQty, usedCount, usedEx, inbound) => ({ name, sap, supplier, storage, onHand, cap, alloc, reorder, sapQty, usedCount, usedEx, inbound: !!inbound });\n    const ings = [\n      I('Humic acid 12%', '400107', 'Live Earth', 'Totes · Bay D-03', 70, 1100, 186, 300, 70, 380, 'ZincPro Starter', true),\n      I('Zinc 9% chelate', '400105', 'Brandt', 'Totes · Bay D-01', 640, 2200, 260, 500, 661, 720, 'S-Boost Starter', true),\n      I('ATS 12-0-0-26S', '400102', 'Tessenderlo Kerley', 'Tank T-02', 3450, 8000, 620, 2500, 3330, 640, 'Starter 10-34 + S', true),\n      I('APP 10-34-0', '400101', 'Northern Plains Fertilizer', 'Tank T-01', 8420, 12000, 1860, 3000, 8515, 1180, 'ZincPro Starter'),\n      I('Boron 10%', '400106', 'Brandt', 'Totes · Bay D-02', 980, 1650, 75, 400, 952, 530, 'K-Sul Foliar'),\n      I('KTS 0-0-25-17S', '400103', 'Tessenderlo Kerley', 'Tank T-03', 5300, 8000, 410, 2000, 5300, 410, 'K-Sul Foliar'),\n      I('UAN 28-0-0', '400104', 'Northern Plains Fertilizer', 'Tank T-04', 11900, 15000, 900, 4000, 11900, 890, 'Boron Plus Foliar'),\n      I('UAN 32-0-0', '400108', 'Northern Plains Fertilizer', 'Tank T-05', 9600, 15000, 1200, 4000, 9600, 520, 'N-Max 32 Blend'),\n      I('Manganese 5%', '400109', 'Prairie Micronutrients', 'Totes · Bay D-04', 310, 1100, 90, 250, 310, 240, 'Micro Mix MnZn'),\n      I('Copper 5%', '400110', 'Prairie Micronutrients', 'Totes · Bay D-05', 420, 1100, 40, 200, 420, 160, 'Cereal Micro Pack'),\n      I('Iron 6% EDTA', '400111', 'Prairie Micronutrients', 'Totes · Bay D-06', 150, 1100, 60, 200, 150, 210, 'Soy Iron Fix'),\n      I('Fulvic acid', '400112', 'Live Earth', 'Totes · Bay D-07', 690, 1100, 120, 250, 690, 300, 'Root Start Plus'),\n      I('Calcium nitrate 9-0-0', '400113', 'AgroChem Supply', 'Tank T-06', 4100, 8000, 300, 1500, 4100, 260, 'Cal-Boost Foliar'),\n      I('Magnesium sulfate', '400114', 'AgroChem Supply', 'Totes · Bay D-08', 520, 1650, 80, 300, 520, 190, 'Mag-Sul Foliar'),\n      I('Potassium acetate', '400115', 'Tessenderlo Kerley', 'Tank T-07', 2600, 6000, 450, 1500, 2600, 150, 'K-Fast Foliar'),\n      I('Seaweed extract', '400116', 'Coastal Kelp Co.', 'Totes · Bay D-09', 380, 1100, 50, 200, 380, 330, 'Bio Start'),\n      I('Molybdenum 1%', '400117', 'Prairie Micronutrients', 'Totes · Bay D-10', 95, 550, 20, 100, 95, 120, 'Pulse Moly Pack'),\n      I('AMS 21-0-0-24S', '400118', 'Northern Plains Fertilizer', 'Tank T-08', 6900, 12000, 700, 2500, 6900, 610, 'Sulfur Plus 28'),\n      I('Surfactant (NIS)', '400119', 'AgroChem Supply', 'Totes · Bay D-11', 260, 1100, 30, 100, 260, 900, 'K-Sul Foliar'),\n      I('Sulfur 15%', '400120', 'AgroChem Supply', 'Totes · Bay D-12', 470, 1100, 110, 200, 470, 180, 'Sulfur Plus 28')\n    ];\n    const adj = st.adj || {}, open = st.open, drafts = st.drafts || {};\n    const rows = ings.map((i0) => {\n      const a = adj[i0.name];\n      const i = Object.assign({}, i0, a ? { onHand: a.to } : {});\n      const avail = i.onHand - i.alloc;\n      const short = avail < 0;\n      const below = !short && avail < i.reorder;\n      const status = short ? 'Short for WO' : (below ? 'Below reorder' : 'OK');\n      const tone = short ? 't-bad' : (below ? 't-warn' : 't-ok');\n      const v = i.onHand - i.sapQty;\n      const draft = drafts[i.name] != null ? drafts[i.name] : i.onHand;\n      const dd = (Number(draft) || 0) - i.onHand;\n      const isOpen = open === i.name;\n      return {\n        short, below, differs: v !== 0, inbound: i.inbound, bulk: i.storage.indexOf('Tank') === 0, tote: i.storage.indexOf('Totes') === 0,\n        onHandN: i.onHand, allocN: i.alloc, availN: avail, absV: Math.abs(v), usedN: i.usedCount, rank: short ? 0 : (below ? 1 : 2),\n        name: i.name, sap: i.sap, supplier: i.supplier, storage: i.storage,\n        onHand: n(i.onHand), cap: n(i.cap), alloc: n(i.alloc), avail: n(avail), reorder: n(i.reorder),\n        levelPct: Math.round(i.onHand / i.cap * 100) + '%', reorderPct: Math.round(i.reorder / i.cap * 100) + '%',\n        barColor: tone === 't-bad' ? '#c62828' : (tone === 't-warn' ? '#a36000' : '#2c6e31'),\n        availColor: tone === 't-bad' ? '#c62828' : (tone === 't-warn' ? '#7a5200' : '#111111'),\n        status, tone, bg: isOpen ? '#fbfdfa' : '#ffffff',\n        sapQty: n(i.sapQty), hasVar: v !== 0, noVar: v === 0, varFg: v < 0 ? '#c62828' : '#1c3a9e', varBg: v < 0 ? '#fdecea' : '#e9f2ff', varText: (v > 0 ? '+' : '−') + n(Math.abs(v)) + ' gal vs SAP',\n        usedCount: n(i.usedCount), usedEx: i.usedEx,\n        open: isOpen, saved: !!a && !isOpen,\n        savedText: a ? (n(a.from) + ' → ' + n(a.to) + ' gal') : '',\n        draft, draftFmt: n(Number(draft) || 0), draftDiff: (dd >= 0 ? '+' : '−') + n(Math.abs(dd)) + ' gal',\n        setDraft: (e) => this.setState({ drafts: Object.assign({}, drafts, { [i.name]: e.target.value }) }),\n        toggle: () => this.setState({ open: isOpen ? null : i.name }),\n        save: () => this.setState({ open: null, adj: Object.assign({}, adj, { [i.name]: { from: i0.onHand, to: Number(draft) || 0 } }) })\n      };\n    });\n    const FIL = {\n      'Need Attention': (r) => r.short || r.below, 'All': () => true, 'Bulk Tanks': (r) => r.bulk, 'Totes': (r) => r.tote,\n      'Short': (r) => r.short, 'Below': (r) => r.below, 'Differs': (r) => r.differs, 'Inbound': (r) => r.inbound\n    };\n    const CHIPS = ['Need Attention', 'All', 'Bulk Tanks', 'Totes'];\n    const TILES = [\n      { k: 'All', label: 'INGREDIENTS STOCKED', color: '#1f5f14' }, { k: 'Short', label: 'SHORT FOR OPEN WOs', color: '#c62828' },\n      { k: 'Below', label: 'BELOW REORDER POINT', color: '#7a5200' }, { k: 'Differs', label: 'DIFFERS FROM SAP', color: '#c62828' },\n      { k: 'Inbound', label: 'DELIVERIES INBOUND', color: '#1f5f14' }\n    ];\n    const view = __st.view || 'Need Attention', q = (__st.q || '').toLowerCase();\n    const pick = (k) => this.setState({ view: k, t_i: Object.assign({}, __st.t_i, { p: 0 }) });\n    const shown = rows.filter((r) => FIL[view](r) && (!q || (r.name + ' ' + r.sap + ' ' + r.storage + ' ' + r.supplier).toLowerCase().indexOf(q) >= 0));\n    const tI = TBL('i', shown, [\n      { label: 'INGREDIENT · SAP MATERIAL #', k: 'name' }, { label: 'STORAGE · SUPPLIER', k: 'storage' }, { label: 'OUR ON HAND (GAL) · LEVEL', k: 'onHandN', desc: true },\n      { label: 'ALLOCATED', k: 'allocN', desc: true }, { label: 'AVAILABLE', k: 'availN' }, { label: 'SAP ON HAND', k: 'absV', desc: true },\n      { label: 'USED IN', k: 'usedN', desc: true }, { label: 'STATUS', k: 'rank', align: 'right' }\n    ], { noun: 'ingredients', k: 'rank', d: 1 });\n    const AL = [\n      { wo: 'WO-2026-10482', products: 'ZincPro Starter · S-Boost Starter · K-Sul Foliar', needs: 'APP 540 · ATS 144 · Zinc 84 · Humic 84 · KTS 96 · Boron 12', gal: 960 },\n      { wo: 'WO-2026-10491', products: 'ZincPro Starter · S-Boost Starter', needs: 'APP 468 · ATS 108 · Zinc 72 · Humic 72', gal: 720 },\n      { wo: 'WO-2026-10492', products: 'Starter 10-34 + S', needs: 'APP 405 · ATS 135', gal: 540 },\n      { wo: 'WO-2026-10480', products: 'Boron Plus Foliar', needs: 'UAN 510 · Boron 90 (28 of 40 left to blend)', gal: 600 },\n      { wo: 'WO-2026-10493', products: 'Micro Mix ZnB', needs: 'Humic 30 · Zinc 75 · Boron 45', gal: 150 },\n      { wo: 'WO-2026-10486', products: 'Micro Mix ZnB', needs: 'Humic 60 · Zinc 150 · Boron 90', gal: 300 },\n      { wo: 'WO-2026-10488', products: 'Starter 10-34 + S', needs: 'APP 315 · ATS 105 (14 of 18 left)', gal: 420 }\n    ];\n    const tAl = TBL('al', AL, [{ label: 'WORK ORDER', k: 'wo' }, { label: 'PRODUCTS', k: 'products' }, { label: 'INGREDIENTS NEEDED (GAL)', k: 'gal', desc: true }], { noun: 'work orders', n: 5 });\n    return {\n      yes: true,\n      chips: CHIPS, chipSel: CHIPS.indexOf(view) >= 0 ? view : '', q: __st.q || '',\n      pickChip: (c) => pick(c), setQ: (v) => this.setState({ q: typeof v === 'string' ? v : '', t_i: Object.assign({}, __st.t_i, { p: 0 }) }),\n      tI, tAl,\n      tiles: TILES.map((t) => { const on = view === t.k; return { label: t.label, color: t.color, count: rows.filter(FIL[t.k]).length, on, bg: on ? '#f6fbf4' : '#ffffff', border: on ? '#2f8f22' : 'transparent', pick: () => pick(on ? 'All' : t.k) }; }),\n      allocRowsOld: [\n        { wo: 'WO-2026-10482', products: 'ZincPro Starter · S-Boost Starter · K-Sul Foliar', needs: 'APP 540 · ATS 144 · Zinc 84 · Humic 84 · KTS 96 · Boron 12' },\n        { wo: 'WO-2026-10491', products: 'ZincPro Starter · S-Boost Starter', needs: 'APP 468 · ATS 108 · Zinc 72 · Humic 72' },\n        { wo: 'WO-2026-10492', products: 'Starter 10-34 + S', needs: 'APP 405 · ATS 135' },\n        { wo: 'WO-2026-10480', products: 'Boron Plus Foliar', needs: 'UAN 510 · Boron 90 (28 of 40 left to blend)' },\n        { wo: 'WO-2026-10493', products: 'Micro Mix ZnB', needs: 'Humic 30 · Zinc 75 · Boron 45' }\n      ]\n    };\n  }\n}\n"},{"id":"SapApi","title":"SAP API health","tpl":"\n\n<div class=\"wg\" style=\"min-height: 100vh; background: #f0f0f0; color: #111111; font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', 'Segoe UI', Roboto, system-ui, sans-serif;\">\n  <header style=\"background: #2f8f22; color: #ffffff; min-height: 60px; display: flex; flex-wrap: wrap; align-items: center; padding: 0 28px; gap: 18px;\">\n    <span style=\"font-weight: 600; font-size: 15px;\">Warehouse Operations</span>\n    <span style=\"flex: 1;\"></span>\n    <a href=\"#SapApi\" data-sapapi=\"1\" aria-label=\"SAP API health: 1 failing, needs attention\" style=\"position: relative; display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 14px; border-radius: 6px; background: #ffffff; color: #1f5f14; font-weight: 700; font-size: 13px; text-decoration: none;\">SAP API<span aria-hidden=\"true\" style=\"display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #c62828; color: #ffffff; font-weight: 800; font-size: 13px; box-shadow: 0 0 0 2px #ffffff;\">!</span></a>\n    <span style=\"font-weight: 600; font-size: 13px; background: rgba(255,255,255,.15); padding: 8px 16px; border-radius: 6px;\">T. Cole — Warehouse supervisor</span>\n  </header>\n  <nav aria-label=\"Module\" style=\"background: #ffffff; display: flex; gap: 4px; padding: 0 28px; overflow-x: auto; border-bottom: 1px solid #dddddd;\">\n    <a href=\"#Main\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Work Orders</a>\n    <a href=\"#Products\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Products</a>\n    <a href=\"#Ingredients\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Ingredients</a>\n    <a href=\"#Reconciliation\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">SAP Reconciliation<span style=\"display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: #c62828; color: #ffffff; font-size: 12px; font-weight: 700;\">5</span></a>\n    <a href=\"#Assets\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Containers &amp; Pallets</a>\n    <a href=\"#Customers\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Customer Assets</a>\n    <a href=\"#ServiceMaintenance\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Service &amp; Maintenance</a>\n    <a href=\"#\" style=\"display: flex; align-items: center; height: 48px; padding: 0 14px; font-weight: 600; font-size: 15px; color: #666666; text-decoration: none; border-bottom: 3px solid transparent; white-space: nowrap;\">Reports</a>\n  </nav>\n\n  <main style=\"max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 24px 28px 40px; display: flex; flex-direction: column; gap: 16px;\">\n    <div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 14px;\">\n      <div style=\"flex: 1 1 320px;\">\n        <h1 style=\"margin: 0; font-weight: 700; font-size: 24px;\">SAP API Health</h1>\n        <div style=\"font-size: 14px; color: #666666; margin-top: 4px;\">Automated tests of every SAP S/4HANA interface we use. Each test checks the connection and login, then compares the response structure to the last known-good version so SAP-side changes are caught quickly. Runs every 15 minutes.</div>\n      </div>\n      <button type=\"button\" class=\"btn2\" style=\"height: 44px;\">Test Settings</button>\n      <button type=\"button\" onClick=\"{{ runAll }}\" style=\"height: 52px; padding: 0 22px; border: none; background: #2f8f22; color: #ffffff; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 17px; cursor: pointer;\">{{ runAllLabel }}</button>\n    </div>\n\n    <sc-if value=\"{{ hasFail }}\" hint-placeholder-val=\"{{ true }}\">\n      <div role=\"alert\" style=\"background: #fdecea; border-left: 6px solid #c62828; border-radius: 8px; padding: 14px 18px; display: flex; flex-wrap: wrap; gap: 14px; align-items: center;\">\n        <span aria-hidden=\"true\" style=\"flex: none; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%; background: #c62828; color: #ffffff; font-weight: 800; font-size: 22px;\">!</span>\n        <div style=\"flex: 1 1 400px;\">\n          <div style=\"font-weight: 700; font-size: 18px; color: #c62828;\">1 API failing: SAP changed the Goods Movement response structure</div>\n          <div style=\"font-size: 14.5px; color: #111111; margin-top: 2px;\">Since 06:00 today. Fill confirmations can't post ingredient usage to SAP. <b>14 postings are queued</b> and will retry automatically once fixed. IT on-call was emailed at 06:01.</div>\n        </div>\n        <button type=\"button\" class=\"btn2\" onClick=\"{{ openFail }}\" style=\"border-color:
